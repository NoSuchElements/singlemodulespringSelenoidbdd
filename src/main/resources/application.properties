# Browser Configuration
browser=chrome
browser.headless=false
browser.timeout=30

# Platform Configuration
# WEB / MOBILE / API
platform=WEB

# Execution Mode: LOCAL | SELENOID | SAUCELABS
execution.mode=LOCAL
appLang=English

# Mobile Configuration
mobile.platform=ios
mobile.device.android=Google Pixel 7 GoogleAPI Emulator
mobile.version.android=15.0
mobile.device.iphone=iPhone Simulator
mobile.version.iphone=17.5

# Cloud Configuration (Sauce Labs)
sauce.username=
sauce.accesskey=
sauce.url=ondemand.saucelabs.com/wd/hub
sauce.region=us-west-1

# ─────────────────────────────────────────────────────────
# Selenoid / Grid Configuration
# To run on Selenoid, set: execution.mode=SELENOID
# Requires: docker-compose -f docker-compose-selenoid.yml up
# ─────────────────────────────────────────────────────────
grid.url=http://localhost:4444/wd/hub
grid.enableVNC=true
grid.enableVideo=true
grid.video.baseUrl=http://localhost:8080
grid.sessionTimeout=300
grid.screenResolution=1920x1080x24

# API Configuration
api.base.url=https://reqres.in
api.timeout=30

# Timeout Configuration
implicit.wait=10
explicit.wait=20
page.load.timeout=30

# Logging
logging.level.root=INFO
logging.level.com.nosuchelements=DEBUG
logging.screenshot.enabled=true

# qTest Configuration
qtest.url=
qtest.api.token=
qtest.cert.path=C:\\Automation\\qTestCert\\qtest.jks
qtest.cert.password=
qtest.project.id=
qtest.enabled=true
qtest.attach.screenshots=true
qtest.connection.timeout=30

qtest.release.cycle.id=
qtest.platform.cycle.web=
qtest.platform.cycle.android=
qtest.platform.cycle.ios=

#PDUser
spring.datasource.pduser.url=
spring.datasource.pduser.username=
spring.datasource.pduser.password=
springjdbc.oracle.driver-class-name=org.h2.Driver
